# Packaging for Tape. Build first (`pnpm build`), or use `pnpm dist` / `pnpm dist:dir`.
# Icons come from `pnpm icons` (build/icon.*, resources/icons/*).
appId: app.tape.client
productName: Tape
copyright: Copyright © 2026 Noah Zhu

directories:
  output: release
  buildResources: build

# The app has no runtime npm dependencies: everything (including the TWS API client in
# src/main/ib/tws and electron-updater) is bundled into out/.
files:
  - out/**/*
  - package.json

# Theme-matched dock / window icons and the dark Finder icon (macOS custom icon), loaded at runtime
# from process.resourcesPath/icons.
extraResources:
  - from: resources/icons
    to: icons
    filter:
      - '*.png'
      - '*.icns'

asar: true

# Electron fuses, flipped in the packaged binary so they cannot be turned back on at run time:
# the app cannot be started as plain Node (ELECTRON_RUN_AS_NODE), take code through NODE_OPTIONS
# or open a debugger port (--inspect), and it only runs the app.asar whose hash it was built with.
# Flipping fuses rewrites Electron Framework, which breaks the signature it ships with; without a
# signing identity electron-builder leaves it that way and Apple Silicon kills the app at launch
# (Code Signature Invalid). resetAdHocDarwinSignature ad-hoc signs the app right after the flip; the
# Developer ID identity, when found, signs over it.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  resetAdHocDarwinSignature: true

# Where the packaged app looks for updates (written into it as app-update.yml; src/main/updater.ts):
# the latest published release of the GitHub repository. electron-builder itself never uploads
# (every build runs with --publish never): .github/workflows/release.yml uploads only the DMG, the
# zip and latest-mac.yml. Local `pnpm dist*` builds leave only the installers in release/
# (scripts/clean-release.ts).
publish:
  provider: github
  owner: 0xnoahzhu
  repo: tape

mac:
  category: public.app-category.finance
  icon: build/icon.icns
  # Apple Silicon only. The DMG is for a first install; the zip is what the updater downloads
  # (Squirrel.Mac installs only from a zip), with latest-mac.yml naming it.
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  darkModeSupport: true
  # Signed with the "Developer ID Application" identity: from the keychain locally, from CSC_LINK /
  # CSC_KEY_PASSWORD in CI. The updater only installs a version signed by the same team.
  # Hardened runtime with electron-builder's default entitlements (JIT and unsigned executable
  # memory for V8). Notarized only when the App Store Connect API key is in the environment
  # (APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER); otherwise the build is signed, not notarized.
  hardenedRuntime: true
  notarize: true
  extendInfo:
    NSUserNotificationAlertStyle: alert

dmg:
  title: Tape ${version}
  writeUpdateInfo: false

# NSIS 3.12 toolset: ships a native makensis for Apple Silicon (the legacy 3.0.4 one is x86_64 only).
toolsets:
  nsis: 1.2.1

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  differentialPackage: false
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

linux:
  target: AppImage
  category: Finance
  synopsis: Desktop trading client for Interactive Brokers
