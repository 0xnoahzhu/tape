# Packaging for Tape. Build first (`pnpm build`), or use `pnpm dist` / `pnpm dist:dir`.
# Icons come from `pnpm icons` (build/icon.*, resources/icons/*).
appId: app.tape.client
productName: Tape
copyright: Copyright © 2026 Noah Zhu

directories:
  output: release
  buildResources: build

# The app has no runtime npm dependencies: everything (including the TWS API client in
# src/main/ib/tws) is bundled into out/.
files:
  - out/**/*
  - package.json

# Theme-matched dock / window icons and the dark Finder icon (macOS custom icon), loaded at runtime
# from process.resourcesPath/icons.
extraResources:
  - from: resources/icons
    to: icons
    filter:
      - '*.png'
      - '*.icns'

asar: true

# Electron fuses, flipped in the packaged binary so they cannot be turned back on at run time:
# the app cannot be started as plain Node (ELECTRON_RUN_AS_NODE), take code through NODE_OPTIONS
# or open a debugger port (--inspect), and it only runs the app.asar whose hash it was built with.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

# Only installers are kept: a DMG for macOS and an NSIS setup for Windows (scripts/clean-release.ts
# removes the intermediate unpacked apps afterwards). No update metadata or block maps.
publish: null

mac:
  category: public.app-category.finance
  icon: build/icon.icns
  target:
    - dmg
  darkModeSupport: true
  # Local builds: no notarization. Set CSC_NAME / CSC_LINK and enable hardenedRuntime to distribute.
  hardenedRuntime: false
  extendInfo:
    NSUserNotificationAlertStyle: alert

dmg:
  title: Tape ${version}
  writeUpdateInfo: false

# NSIS 3.12 toolset: ships a native makensis for Apple Silicon (the legacy 3.0.4 one is x86_64 only).
toolsets:
  nsis: 1.2.1

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  differentialPackage: false
  artifactName: ${productName}-${version}-${arch}-setup.${ext}

linux:
  target: AppImage
  category: Finance
  synopsis: Desktop trading client for Interactive Brokers
